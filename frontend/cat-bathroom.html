<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kucing di Kamar Mandi · Pet Coin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/gajah.css" />
  <link rel="stylesheet" href="css/bathroom-scene.css" />
  <style>
    html,body{margin:0;background:transparent;overflow:hidden}.pet-layout{width:100%;max-width:1160px;margin:0 auto;padding:8px 10px 18px;display:block}.pet-stage{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto auto auto auto auto auto auto;min-height:690px;height:auto;padding:18px 22px 16px}.pet-stage>.stage-top,.pet-stage>.room-switch{grid-column:1/-1}.pet-stage>.stage-top{grid-row:1}.pet-stage>.room-switch{grid-row:2}.pet-stage>.pet-art{grid-column:1/-1;grid-row:3;height:450px;min-height:450px;margin:8px 0 18px}.pet-stage>.pet-name-row{grid-column:1/-1;grid-row:4;margin-top:0}.pet-stage>.pet-hint{grid-column:1/-1;grid-row:5;min-height:18px}.pet-stage>.other-pets-link{grid-column:1/-1;grid-row:6;justify-self:start;align-self:start}.pet-stage>.bath-actions{grid-column:1/-1;grid-row:7}.pet-art>.pet-tap{touch-action:none;cursor:grab}.pet-art>.pet-tap.dragging{cursor:grabbing;animation:none;transition:none}.pet-art>.pet-tap.dragging img{pointer-events:none}.pet-art{overflow:hidden}.room-bathroom .pet-tap.bounce{animation:pet-straight-hop .9s cubic-bezier(.2,.8,.25,1.2) 2}.bathroom-props .room-bath:before{display:block;left:8%;right:8%;top:12px;height:15px;border:3px solid var(--ink);border-radius:0;background:repeating-linear-gradient(135deg,#8ce3ed 0 9px,#48c8dd 9px 18px);box-shadow:3px 3px 0 var(--ink)}.other-pets-link{width:max-content;max-width:100%;margin:8px 0 0;padding:8px 10px;font-size:9px;text-decoration:none;white-space:nowrap}.bath-panel{margin-top:14px}.bath-panel .bath-towel{width:100%;height:76px}.bath-panel .bath-towel:before{top:12px;height:19px}.bath-panel .bath-towel:after{bottom:12px;height:19px}.bath-panel .bath-towel.dragging{position:fixed;width:122px;height:76px}@media(max-width:680px){.pet-layout{padding:4px 8px 14px}.pet-stage{display:flex;flex-direction:column;height:auto;min-height:570px;padding:14px}.pet-stage>.pet-art{height:370px;min-height:370px;margin:5px 0 14px}.pet-stage>.pet-name-row h1{font-size:30px}.pet-stage>.pet-hint{font-size:9px}.bath-panel{margin-top:12px}.bath-panel .bath-towel{height:65px}.other-pets-link{margin-top:8px}}
    .bath-actions{display:block;width:100%;margin-top:30px}.bath-actions .bath-panel{margin-top:0}.other-pets-link{display:inline-flex;align-self:flex-start;margin:8px 0 0;padding:8px 10px;font-size:9px;text-decoration:none;white-space:nowrap}
    @media(max-width:680px){.other-pets-link{padding:7px 8px;font-size:8px}}
  </style>
</head>
<body>
  <main class="pet-layout">
    <section class="pet-stage room-scene room-bathroom" id="room-stage">
      <div class="stage-top"><span>YOUR PET</span><span class="status-chip" id="mood-chip">FEELING GOOD ✳</span></div>
      <div class="room-switch"><span class="room-label"><span class="eyebrow">ROOM <b>03</b> / 03</span><b>Bathroom</b></span></div>
      <div class="pet-art" id="pet-art">
        <div class="room-props bathroom-props" id="room-props"><span class="room-fixture"></span><span class="room-shower"><i class="shower-arm"></i><i class="shower-head"></i><i class="shower-handle"></i><i class="shower-hose"></i></span><button class="room-shower-switch" id="shower-toggle" type="button" aria-label="Nyalakan shower" aria-pressed="false">OFF</button><span class="room-bath"></span></div>
        <div class="shower-water" id="shower-water" aria-hidden="true" hidden></div>
        <button class="soap-item" id="soap-item" type="button" aria-label="Sabun, seret untuk memindahkan">SOAP <span>✳</span></button>
        <div class="art-rays"></div>
        <button class="pet-tap" id="pet-tap" type="button" aria-label="Elus Kucing"><img id="pet-image" src="png/kucing123.png" alt="Kucing" /><span class="pet-wet-overlay" id="pet-wet-overlay" aria-hidden="true"></span></button>
        <span class="soap-foam" id="soap-foam" aria-hidden="true" hidden></span>
        <div class="shower-drops" id="shower-drops" aria-hidden="true"></div>
        <span class="stage-sticker">TAP<br>FOR LOVE ♥</span>
      </div>
      <div class="pet-name-row"><div><span class="eyebrow">RARE PET · NO. 002</span><h1>Kucing</h1></div><span class="pet-level">LVL <b>01</b></span></div>
      <p class="pet-hint" id="pet-hint" aria-live="polite">Elus Kucing atau geser ke bathtub!</p>
      <a class="neo-button blue-button other-pets-link" href="shop.html" target="_top">Lihat hewan lainnya <span>↗</span></a>
      <div class="bath-actions">
        <section class="control-panel bath-panel">
          <div class="panel-heading"><div><span class="eyebrow">SPLISH SPLASH</span><h2>Bath time</h2></div><span class="panel-icon">✳</span></div>
          <p>Seret handuk ke Kucing setelah mandi.</p>
          <button class="bath-towel" id="bath-towel" type="button" aria-label="Seret handuk ke Kucing"><span class="towel-fold"></span><b>HANDUK</b></button>
        </section>
      </div>
    </section>
  </main>
  <script src="js/cat-bathroom.js"></script>
</body>
</html>
